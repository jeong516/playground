<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0f14" />
  <title>영웅서기: 솔티아의 바람</title>
  <meta name="description" content="최신 스마트폰 풀스크린 최적화 액션 RPG 영웅서기: 솔티아의 바람" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div id="appViewport" class="app-viewport">
    <!-- 100% Full-Bleed Edge-to-Edge Game Canvas -->
    <canvas id="gameCanvas" width="480" height="360"></canvas>

    <!-- Floating Modern In-Game HUD -->
    <div id="gameHud" class="hud-layer hidden">
      <!-- Top Safe-Area Row -->
      <div class="hud-top">
        <!-- Hero Status Glass Pill -->
        <div class="hero-pill" data-open-menu="status" role="button" tabindex="0">
          <div class="portrait-ring">
            <canvas id="hudPortrait" width="96" height="96"></canvas>
            <span id="hudLv" class="lv-chip">1</span>
          </div>
          <div class="hero-meters">
            <div class="hero-meta-row">
              <span id="hudName" class="hero-name">기사 케인</span>
              <span id="hudGold" class="hero-gold">120 G</span>
            </div>
            <div class="meter hp-meter">
              <div id="hudHpFill" class="meter-fill hp-fill" style="width:100%"></div>
              <span id="hudHpText" class="meter-text">260/260</span>
            </div>
            <div class="meter mp-meter">
              <div id="hudMpFill" class="meter-fill mp-fill" style="width:100%"></div>
              <span id="hudMpText" class="meter-text">78/78</span>
            </div>
            <div class="meter exp-meter">
              <div id="hudExpFill" class="meter-fill exp-fill" style="width:0%"></div>
            </div>
          </div>
        </div>

        <!-- Right Map + Compact Glass Dock -->
        <div class="hud-right">
          <div class="map-chip">
            <span class="map-pulse"></span>
            <span id="hudMapName">솔티아 마을</span>
          </div>
          <div class="dock-row">
            <button class="glass-ico" data-open-menu="status" type="button" aria-label="상태">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span id="dotStat" class="dot-alert" style="display:none"></span>
            </button>
            <button class="glass-ico" data-open-menu="bag" type="button" aria-label="가방">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </button>
            <button class="glass-ico" data-open-menu="skills" type="button" aria-label="스킬">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span id="dotSkill" class="dot-alert" style="display:none"></span>
            </button>
            <button id="btnSettings" class="glass-ico" type="button" aria-label="설정">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Floating Quest Tracker Pill -->
      <button id="hudQuestPill" class="quest-chip" type="button">
        <span class="q-dot"></span>
        <span id="hudQuestText">촌장 엘더와 대화하세요</span>
      </button>

      <!-- Floating Boss Health Bar -->
      <div id="hudBossBar" class="boss-banner hidden">
        <div class="boss-head">
          <span id="hudBossName">보스</span>
          <span id="hudBossHpTxt">100%</span>
        </div>
        <div class="boss-track">
          <div id="hudBossFill" class="boss-fill" style="width:100%"></div>
        </div>
      </div>

      <!-- Crisp Retina Map Transition Banner -->
      <div id="mapBanner" class="map-banner" aria-live="polite">
        <div id="mapBannerTitle" class="map-banner-title">솔티아 마을</div>
        <div id="mapBannerSub" class="map-banner-sub">평화로운 시작의 마을</div>
      </div>

      <!-- Compact Settings Popover -->
      <div id="settingsPopover" class="settings-popover hidden">
        <button id="btnBgm" class="pop-item active" type="button">
          <span>배경음악 (BGM)</span>
          <strong id="bgmState">ON</strong>
        </button>
        <button id="btnSfx" class="pop-item active" type="button">
          <span>효과음 (SFX)</span>
          <strong id="sfxState">ON</strong>
        </button>
        <button id="btnPadMode" class="pop-item" type="button">
          <span>조작 모드</span>
          <strong id="padModeLabel">조이스틱</strong>
        </button>
        <button id="btnSave" class="pop-item" type="button">
          <span>지금 저장하기</span>
          <strong>SAVE</strong>
        </button>
      </div>

      <!-- Floating Transparent Touch Gamepad (Overlays Full-Screen World) -->
      <div id="mobileGamepad" class="touch-overlay" aria-label="터치 컨트롤러">
        <!-- Left-Side Quick Potion Orbs (above thumbstick) -->
        <div class="floating-potions">
          <button id="btnPotHp" class="pot-orb hp-orb" type="button" aria-label="HP 포션">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M9 3h6v2l-1 1v3.2l4.2 6.8A3 3 0 0 1 15.6 21H8.4a3 3 0 0 1-2.6-5L10 9.2V6L9 5V3z"/></svg>
            <span id="potHpCount" class="pot-cnt">0</span>
          </button>
          <button id="btnPotMp" class="pot-orb mp-orb" type="button" aria-label="MP 포션">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 2.5C12 2.5 5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>
            <span id="potMpCount" class="pot-cnt">0</span>
          </button>
          <button id="btnScrollTown" class="pot-orb town-orb" type="button" aria-label="마을 귀환">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span id="scrollCount" class="pot-cnt">0</span>
          </button>
        </div>

        <!-- Bottom-Left Floating Analog Stick -->
        <div id="stickZone" class="stick-zone">
          <div class="stick-ring">
            <div id="stickKnob" class="stick-knob"></div>
          </div>
        </div>

        <!-- Bottom-Right Ergonomic Curved Skill Arc + Dash + Primary Attack Orb -->
        <div class="right-arc-cluster">
          <div id="mobileSkillSlots" class="arc-skills"></div>
          <button id="btnMobileDash" class="arc-dash" type="button" aria-label="회피">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/><path d="M2 8h4"/><path d="M2 16h4"/></svg>
          </button>
          <button id="btnMobileAttack" class="arc-attack" type="button" aria-label="공격 및 대화">
            <span id="mobileAtkIcon" class="atk-svg">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/></svg>
            </span>
            <span id="mobileAtkLabel" class="atk-txt">공격</span>
          </button>
        </div>
      </div>

      <!-- Optional Classic Feature-Phone Floating Keypad -->
      <aside id="phoneKeypad" class="phone-keypad hidden" aria-label="피처폰 키패드">
        <div class="dpad-area">
          <div></div>
          <button id="padUp" class="pad-btn" type="button">▲</button>
          <div></div>
          <button id="padLeft" class="pad-btn" type="button">◀</button>
          <button id="padOk" class="pad-btn ok-btn" type="button">OK</button>
          <button id="padRight" class="pad-btn" type="button">▶</button>
          <div></div>
          <button id="padDown" class="pad-btn" type="button">▼</button>
          <div></div>
        </div>
        <div class="num-grid">
          <button class="num-btn" data-pad-action="s1" type="button"><strong>1</strong><span>스킬1</span></button>
          <button class="num-btn" data-pad-action="s2" type="button"><strong>2</strong><span>스킬2</span></button>
          <button class="num-btn" data-pad-action="s3" type="button"><strong>3</strong><span>스킬3</span></button>
          <button class="num-btn" data-pad-action="hp" type="button"><strong>4</strong><span>HP</span></button>
          <button class="num-btn" data-pad-action="attack" type="button"><strong>5</strong><span>공격</span></button>
          <button class="num-btn" data-pad-action="mp" type="button"><strong>6</strong><span>MP</span></button>
          <button class="num-btn" data-pad-action="s4" type="button"><strong>7</strong><span>궁극기</span></button>
          <button class="num-btn" data-pad-action="dash" type="button"><strong>8</strong><span>회피</span></button>
          <button class="num-btn" data-pad-action="menu" type="button"><strong>9</strong><span>가방</span></button>
        </div>
      </aside>
    </div>

    <!-- Cinematic Full-Screen Title Screen -->
    <div id="titleScreen" class="overlay-screen title-screen">
      <div class="title-hero-block">
        <div class="title-kicker">HEROES LORE · MOBILE EDITION</div>
        <h1 class="title-display">영웅서기</h1>
        <p class="title-tagline">솔티아의 바람</p>
      </div>
      <div class="title-bottom-dock">
        <button id="btnNewGame" class="cta-btn primary" type="button">새 모험 시작</button>
        <button id="btnContinue" class="cta-btn ghost" type="button" disabled>이어하기</button>
      </div>
    </div>

    <!-- Modern Full-Screen Class Selector -->
    <div id="selectScreen" class="overlay-screen hidden">
      <div class="sheet-container">
        <div class="sheet-handle"></div>
        <div class="title-kicker">SELECT HERO</div>
        <h2 class="sheet-title">영웅을 선택하세요</h2>
        <div id="classGrid" class="class-grid"></div>
        <div class="sheet-actions">
          <button id="btnBackTitle" class="cta-btn ghost" type="button">뒤로</button>
          <button id="btnStartAdventure" class="cta-btn primary" type="button">솔티아로 출발</button>
        </div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameoverScreen" class="overlay-screen hidden">
      <div class="result-card">
        <div class="title-kicker" style="color:#fb7185;">DEFEATED</div>
        <h2 class="result-title" style="color:#fecdd3;">전투 불능</h2>
        <p class="result-sub">소지금의 10%를 잃고 솔티아 마을에서 다시 일어납니다.</p>
        <button id="btnRevive" class="cta-btn primary" type="button">솔티아 마을에서 부활</button>
      </div>
    </div>

    <!-- Victory -->
    <div id="victoryScreen" class="overlay-screen hidden">
      <div class="result-card">
        <div class="title-kicker">LEGEND OF SOLTIA</div>
        <h2 class="result-title">솔티아의 영웅</h2>
        <p class="result-sub">심연의 기사 바르가스를 물리치고 대륙에 평화를 되찾았습니다!</p>
        <button id="btnContinueAfterWin" class="cta-btn primary" type="button">자유 모험 계속하기</button>
      </div>
    </div>

    <!-- Modern Floating Dialog Sheet -->
    <div id="dialogBox" class="dialog-sheet hidden" role="dialog" aria-live="polite">
      <div class="dialog-header-row">
        <span id="dialogSpeaker" class="dialog-speaker"></span>
        <span class="dialog-tap-hint">터치 ▸</span>
      </div>
      <div id="dialogText" class="dialog-text"></div>
    </div>

    <!-- Modern iOS/Android Frosted Bottom-Sheet Modal -->
    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="modal-header">
          <div id="modalTabs" class="modal-tabs"></div>
          <button id="modalClose" class="modal-close" type="button" aria-label="닫기">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Hidden desktop skill container fallback kept empty for compatibility -->
  <div id="skillSlots" style="display:none"></div>

  <script src="js/audio.js?v=5"></script>
  <script src="js/sprites.js?v=5"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/game.js?v=5"></script>
</body>
</html>
